<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9x16 — hero rig v2 · fixed aperture, swapping bodies</title>

<style>
/* ==========================================================================================
   9x16 · HERO RIG v2
   This is the RIG, not the art. Every photograph is an empty labelled slot. Nothing here
   fakes an object with CSS shapes — that is what killed v1.

   THE MECHANIC
   · A 16:9 aperture sits FIXED and STATIONARY in the middle of the viewport. It does not
     move while you scroll through the first half. The viewport is NOT restricted.
   · What changes is the BODY holding it: tv → cinema → billboard → laptop, cross-fading.
   · On scroll the aperture contracts 16:9 → 9:16 and the body becomes an iPhone.
   · The ground underneath is a pavement, shot top-down — the viewport is the POV of someone
     stood still, looking down at the phone in their hand.
   · The gutters either side of the phone are that pavement. Never content.

   ───────────────────────────────────────────────────────────────────────────────────────
   HOW TO DROP A PHOTO IN  (the whole point of the rig)

   Each body photo has its screen in a different place. So a photo carries three numbers:

       --sw : the screen's WIDTH,    as a % of the whole photo
       --sx : the screen's CENTRE X, as a % of the whole photo
       --sy : the screen's CENTRE Y, as a % of the whole photo

   The rig scales and offsets the photo so its screen lands exactly on the aperture. Swapping
   a photo = drop the file in assets/ and correct three numbers. No layout work.

   To measure them: press  R  to toggle registration mode. It outlines the aperture over the
   photo and prints the current numbers. Nudge until the outline sits on the screen.
   ────────────────────────────────────────────────────────────────────────────────────── */

@font-face { font-family:"Clash Display"; src:url("assets/fonts/clash-display-600.woff2") format("woff2"); font-weight:600; font-display:swap; }
@font-face { font-family:"Switzer"; src:url("assets/fonts/switzer-400.woff2") format("woff2"); font-weight:400; font-display:swap; }
@font-face { font-family:"Switzer"; src:url("assets/fonts/switzer-600.woff2") format("woff2"); font-weight:600; font-display:swap; }
@font-face { font-family:"Switzer"; src:url("assets/fonts/switzer-700.woff2") format("woff2"); font-weight:700; font-display:swap; }

:root{
  --snow:#FAFAFA; --paper:#F1EEE9; --pitch:#100C08; --orange:#FF7B00;
  --brick:#8A100C; --mute:#6B6560; --line:rgba(16,12,8,.09);
  /* v1's easing token. It was referenced by the nav, burger and menu transitions but never
     defined here — an undefined var makes the whole transition declaration invalid, so the
     browser threw it away and everything snapped instead of animating. */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --col:clamp(360px, calc(100dvh * 9 / 16), 620px);   /* where the aperture ends up */
  --apw:62vw;                                          /* live aperture width, driven by JS */
  --aph:calc(62vw * 9 / 16);                           /* live aperture height, driven by JS */
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--snow); color:var(--pitch); font-family:"Switzer",system-ui,sans-serif; font-size:17px; -webkit-font-smoothing:antialiased;}

/* ───────────────────────────────────────────────────────────── nav
   v1 geometry verbatim (styles.css:116-123): fixed, 16px from the top, centred, capped at
   1180px, solid snow with an inset hairline and a soft drop shadow. On the morph it shrinks
   to the phone's screen width and drops below the dynamic island, becoming a phone nav. */
.nav{position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:50; display:flex; justify-content:center;
     width:100%; padding:var(--nav-top,16px) var(--nav-pad,clamp(1.25rem,4vw,4rem)) 0; pointer-events:none;}
.nav__inner{
  width:var(--nav-w, min(1180px,100%)); display:flex; align-items:center; justify-content:space-between;
  padding:.7rem .9rem .7rem 1.4rem; background:#fff; pointer-events:auto;
  box-shadow:inset 0 0 0 1px rgba(16,12,8,.10), 0 12px 38px rgba(16,12,8,.08);
}
/* v1 verbatim, styles.css:125-146 — logo, lowercase Clash links, 44px burger with 25x2 bars */
.nav__brand{display:inline-flex; align-items:center;}
.nav__logo{height:var(--logo-h,56px); width:auto; display:block;}
.nav__links{display:flex; align-items:center; gap:clamp(1.1rem,2.4vw,2.1rem); padding-right:.7rem;}
.nav__links a{
  font-family:"Clash Display",sans-serif; font-weight:500; text-transform:lowercase;
  color:var(--pitch); text-decoration:none; font-size:1.12rem; opacity:.9;
  transition:opacity .2s var(--ease-out);
}
.nav__links a:hover{opacity:1;}
.nav__burger{display:none; flex-direction:column; justify-content:center; align-items:center; gap:7px;
  width:44px; height:44px; padding:0; background:none; border:none; cursor:pointer; color:var(--pitch);}
.nav__burger span{display:block; width:25px; height:2px; background:currentColor;
  transition:transform .32s var(--ease-out), opacity .2s var(--ease-out);}
.nav__burger.is-open span:nth-child(1){transform:translateY(9px) rotate(45deg);}
.nav__burger.is-open span:nth-child(2){opacity:0;}
.nav__burger.is-open span:nth-child(3){transform:translateY(-9px) rotate(-45deg);}
/* once it has constricted onto the phone there is no room for inline links — a phone's rule */
.nav.is-phone .nav__links{display:none;}
.nav.is-phone .nav__burger{display:flex;}
.nav.is-phone .nav__inner{padding:.35rem .5rem .35rem .8rem; box-shadow:inset 0 0 0 1px rgba(16,12,8,.10);}

/* GLASS — only in the 16:9 state, where the bar floats over a dark photographic scene and a
   solid white slab shouts. Translucent, blurred, light ink. The phone state stays solid white:
   there the bar is UI on a screen, not an overlay on a photograph. */
.nav.is-glass .nav__inner{
  background:rgba(20,18,16,.30);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20);
}
.nav.is-glass .nav__links a{color:var(--snow);}
.nav.is-glass .nav__burger{color:var(--snow);}
.nav__logo--dark{display:none;}
.nav.is-glass .nav__logo--light{display:none;}
.nav.is-glass .nav__logo--dark{display:block;}
.nav.is-open{z-index:90;}

/* v1's mobile overlay, styles.css:157-182 — orange, wipes in from the RIGHT, one link per
   9:16 grid row, tap fills the row white. Clipped to the phone screen instead of the viewport,
   and its row height is measured against the frame rather than 29.2vw. */
/* v1 had to use a clip-path curtain because its menu was position:fixed and a translated
   fixed element escapes the body's containing block. Ours is absolute inside the pin, so a
   real translateX slide is safe — and it is unambiguously a slide, which is what was asked. */
.menu{position:absolute; left:50%; top:50%; transform:translate(-50%, calc(-50% + var(--apy, 0px)));
      width:var(--apw); height:var(--aph); z-index:5; overflow:hidden;
      visibility:hidden; transition:visibility 0s linear .5s;}
.menu.is-open{visibility:visible; transition:visibility 0s linear 0s;}
.menu__panel{position:absolute; inset:0; background:var(--orange); will-change:transform;
      transform:translateX(100%); transition:transform .5s var(--ease-out);}
.menu.is-open .menu__panel{transform:translateX(0);}
.menu__grid{position:absolute; inset:0; z-index:0;}
.menu__grid span{position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.45);}
.menu__grid::before{content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.45) 0, rgba(255,255,255,.45) 1px, transparent 1px, transparent calc(var(--apw) * 0.292));}
.menu__links{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:center;}
.menu__row{
  position:relative; display:flex; align-items:center; height:calc(var(--apw) * 0.292);
  padding:0 9%; margin-top:-1px;
  background:var(--orange); color:#fff; text-decoration:none;
  font-family:"Clash Display",sans-serif; font-weight:600; text-transform:lowercase;
  font-size:clamp(1.6rem, calc(var(--apw) * 0.09), 3.1rem); letter-spacing:-.02em; line-height:1;
  border-top:1px solid rgba(255,255,255,.45); border-bottom:1px solid rgba(255,255,255,.45);
  transition:background-color .2s var(--ease-out), color .2s var(--ease-out);
}
.menu__row:active, .menu__row.is-active{background:#fff; color:var(--orange);}

/* ── the phone's own screen chrome: status bar above the frame, home bar below it ───────
   Both live on the white screen OUTSIDE the crop box, which is what makes the crop line
   readable as a crop line rather than the edge of the screen. */
.screenui{position:absolute; left:50%; top:var(--scr-top,0px); transform:translateX(-50%);
  width:var(--scr-w,0px); height:var(--scr-h,0px); z-index:7; pointer-events:none; opacity:0;
  color:var(--pitch); font-family:"Switzer",sans-serif;}
.status{position:absolute; left:0; right:0; top:var(--status-top,0px); height:var(--status-h,22px);
  display:flex; align-items:center; justify-content:space-between; padding:0 8.5%;
  font-weight:700; font-size:.82rem; letter-spacing:.01em;}
.status__icons{display:flex; align-items:center; gap:5px;}
.status__icons svg{display:block;}
.homebar{position:absolute; left:50%; transform:translateX(-50%); bottom:var(--home-b,10px);
  width:36%; height:5px; border-radius:999px; background:var(--pitch); opacity:.85;}

/* ───────────────────────────────────────────────────────────── pin shell
   180vh = 80vh of pinned scroll. The morph runs 0.05 → 0.70 of that, so it starts on the
   very first scroll and is finished inside roughly half a screen of scrolling. */
.hero{position:relative; height:180vh;}
.pin{position:sticky; top:0; height:100dvh; overflow:hidden; background:var(--snow);}

/* ───────────────────────────────────────────────────────────── 0 · THE PAGE GRID
   Light theme. This is the same Swiss grid from our v1 build — verticals at the original
   column positions — and it is what sits behind the body and the frame. The pavement is
   NOT here at the start; it fades in over this during the transformation. */
.bggrid{position:absolute; inset:0; z-index:0; pointer-events:none; background:var(--snow);}
.bggrid span{position:absolute; top:0; bottom:0; width:1px; background:var(--line);}
.bggrid i{position:absolute; left:0; right:0; height:1px; background:var(--line);}

/* ───────────────────────────────────────────────────────────── 1 · THE GROUND
   PHOTO SLOT — pavement, shot straight down, filling the viewport.
   Drop in: assets/ground-pavement.jpg
   The fill below is TEMPORARY SCAFFOLDING, not the design. It is an exact 9:16 herringbone
   so the geometry is right to build against — herringbone alternates 90°, so half the pavers
   read 9:16 and half read 16:9. The two formats, interlocked, under the whole site. */
.ground{position:absolute; inset:0; z-index:1; overflow:hidden; background:var(--paper); opacity:0;}
.ground img{width:100%; height:100%; object-fit:cover; display:block;}
.ground--placeholder{
  /* Paver cell 108 x 192px — exactly 9:16, and big enough to read as paving rather than
     noise. Previously this drew FOUR gradients (45px and 80px on both axes), which is a
     plaid, not a herringbone — that dense mesh over the page grid is what made the gutters
     look like overlapping grids. Two layers, one cell size. TEMP; delete when the photo lands. */
  background-color:#E9E5DF;
  background-image:
    repeating-linear-gradient(90deg, rgba(16,12,8,.10) 0 1px, transparent 1px 108px),
    repeating-linear-gradient(0deg,  rgba(16,12,8,.10) 0 1px, transparent 1px 192px);
}
.ground__tag{
  position:absolute; left:1.2rem; bottom:1.1rem; z-index:2;
  font-size:.62rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--mute); font-weight:600;
}

/* PROP SLOTS — flyers, small products, paper planes carrying client branding.
   Each is an <img> with a transparent cut-out. Position is % of the viewport.
   These are the campaign teasers, so they are separate layers and meant to be swapped. */
.props{position:absolute; inset:0; z-index:2; pointer-events:none;}
.prop{position:absolute; opacity:0; will-change:transform,opacity;}
.prop img{display:block; width:100%; height:auto;}

/* ───────────────────────────────────────────────────────────── 2 · THE BODIES
   PHOTO SLOTS — the object holding the frame. Real photography, screens blank/black.
   Sized and offset from --sw/--sx/--sy so every screen registers on the same aperture. */
.stage{position:absolute; inset:0; z-index:3;}
.body{
  position:absolute; left:50%; top:50%; margin:0; opacity:0;
  /* landscape plates are sized by JS to COVER the viewport (--plate-w); the phone still
     scales off the screen width. Either way the plate's own screen centre lands dead centre. */
  width:var(--plate-w, 100%);
  transform:translate(calc(var(--sx) * -1%), calc(var(--sy) * -1%));
  will-change:opacity,width;
}
/* The phone is the one body whose screen is NOT the aperture: the crop box insets inside it.
   Sizing it off --apw like the others shrank the whole handset, so the real screen sat ~28px
   below where the chrome was being placed. It scales off the screen width instead. */
.body[data-body="phone"]{ width:calc(var(--screenw) * (100 / var(--sw))); }
.body img{display:block; width:100%; height:auto;}

/* the empty-slot marker. Deliberately NOT an illustration of the object — a labelled hole,
   so nobody mistakes scaffolding for design. Delete .slot when the photo goes in. */
.slot{
  position:relative; width:100%; aspect-ratio:var(--ar,16/10);
  border:2px dashed rgba(16,12,8,.3); border-radius:2px;
  display:grid; place-content:center; gap:.35rem; text-align:center;
  background:rgba(16,12,8,.025);
}
.slot b{font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(16,12,8,.62);}
.slot span{font-size:.7rem; color:var(--mute);}

/* ───────────────────────────────────────────────────────────── 3 · THE APERTURE
   Fixed 16:9. Contracts to 9:16 on the second half of the scroll. The site's content lives
   in here — for now just a marker so the geometry is legible. */
.aperture{
  position:absolute; left:50%; top:50%; transform:translate(-50%, calc(-50% + var(--apy, 0px)));
  width:var(--apw); height:var(--aph); z-index:4;
  background:var(--snow); overflow:hidden;
}
/* THE CROP — always on, in both states. Rails + registration marks, the site's own language.
   Tracks --apw/--aph so it sits on the aperture at 16:9 and 9:16 alike, and through the
   morph between them. Lives above the aperture so overflow:hidden can't clip the marks. */
.crop{
  position:absolute; left:50%; top:50%; transform:translate(-50%, calc(-50% + var(--apy, 0px)));
  /* HIDDEN FOR NOW — delete this one line to bring the rails and registration marks back.
     The markup, the geometry and the assertions that keep the frame clear of the island and
     the corner curvature all still run, so nothing has to be rebuilt to restore it. */
  display:none;

  /* the crop rails sit ABOVE the menu — the crop line is never covered by anything, it is
     the one constant of the whole piece. Layer order: aperture 4 · menu 5 · crop 6 · chrome 7 */
  width:var(--apw); height:var(--aph); z-index:6; pointer-events:none;
  border:2px solid var(--pitch);
}
.crop__c{position:absolute; width:12px; height:12px; background:var(--snow); border:2px solid var(--pitch);}
.crop__c--tl{top:-7px; left:-7px;}  .crop__c--tr{top:-7px; right:-7px;}
.crop__c--bl{bottom:-7px; left:-7px;} .crop__c--br{bottom:-7px; right:-7px;}

/* THE GRID CONTINUES INSIDE THE FRAME.
   Verticals sit at the page's own six column positions, so the grid outside and the grid
   inside are the same system. Rows step at 29.2% of the FRAME'S width — which makes every
   cell a true 9:16 box whatever the frame is currently doing. One rule covers both states:
   wide coarse desktop cells at 16:9, and the same grid scaled down into the phone at 9:16,
   where it becomes the background the content sits on. */
.ap-grid{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image:repeating-linear-gradient(to bottom,
    var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(var(--apw) * 0.292));
}
.ap-grid span{position:absolute; top:0; bottom:0; width:1px; background:var(--line);}

/* stationary and centred, independent of whatever the aperture is currently doing */
.headline{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:8;
  display:grid; place-items:center; gap:.5rem; text-align:center; padding:1rem; pointer-events:none;}
.aperture__h{font-family:"Clash Display",sans-serif; font-weight:600; font-size:clamp(1.4rem,3.4vw,3rem); line-height:.95; margin:0; text-transform:lowercase; letter-spacing:-.02em;}
.aperture__m{font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600;}

/* registration mode — press R. Shows where the aperture sits so you can align a new photo. */
body.reg .aperture{background:rgba(255,123,0,.14); outline:2px solid var(--orange); outline-offset:0;}
body.reg .body{opacity:1 !important;}
body.reg .body:not(.is-live){opacity:.18 !important;}
#regout{
  position:fixed; left:0; bottom:0; z-index:99; display:none;
  background:var(--pitch); color:#8f8; font:12px/1.6 ui-monospace,monospace;
  padding:.7rem 1rem; white-space:pre; max-width:100%; overflow:auto;
}
body.reg #regout{display:block;}

.cue{position:absolute; left:50%; bottom:1.8rem; transform:translateX(-50%); z-index:6; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600;}

@media (prefers-reduced-motion:reduce){ .hero{height:auto;} .pin{position:relative;} }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="#top" aria-label="9x16 Media home">
      <img class="nav__logo nav__logo--light" src="assets/logo.svg" alt="9x16 Media">
      <img class="nav__logo nav__logo--dark" src="assets/logo-dark.svg" alt="9x16 Media">
    </a>
    <nav class="nav__links" aria-label="Primary">
      <a href="#">what we do</a><a href="#">our work</a><a href="#">work with us</a>
    </nav>
    <button class="nav__burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="pin">

    <!-- 0 · PAGE GRID — light theme, v1 column positions. Sits behind body and frame. -->
    <div class="bggrid" aria-hidden="true">
      <span style="left:9%"></span><span style="left:25.5%"></span><span style="left:41.8%"></span>
      <span style="left:58.2%"></span><span style="left:74.5%"></span><span style="left:91%"></span>
      <i style="top:24%"></i><i style="top:68%"></i>
    </div>

    <!-- 1 · GROUND ────────────────────────────────────────────────────────────────────── -->
    <div class="ground ground--placeholder" id="ground">
      <!-- <img src="assets/ground-pavement.jpg" alt=""> ← drop the pavement plate here -->
      <span class="ground__tag">slot · ground-pavement.jpg — top-down, 9:16 pavers</span>

      <div class="props" id="props">
        <!-- PROP SLOTS · cut-out PNGs, campaign teasers. left/top are % of viewport. -->
        <figure class="prop" data-prop="flyer-a"  style="left:11%; top:64%; width:9vw;  --rot:-14deg;"></figure>
        <figure class="prop" data-prop="plane-a"  style="left:20%; top:28%; width:7vw;  --rot:22deg;"></figure>
        <figure class="prop" data-prop="can"      style="left:83%; top:71%; width:5vw;  --rot:8deg;"></figure>
        <figure class="prop" data-prop="flyer-b"  style="left:78%; top:34%; width:8.5vw;--rot:31deg;"></figure>
        <figure class="prop" data-prop="plane-b"  style="left:88%; top:52%; width:6.5vw;--rot:-9deg;"></figure>
        <figure class="prop" data-prop="leaf"     style="left:14%; top:44%; width:4vw;  --rot:-40deg;"></figure>
      </div>
    </div>

    <!-- 2 · BODIES ────────────────────────────────────────────────────────────────────── -->
    <div class="stage">
      <!-- --sw/--sx/--sy are PLACEHOLDER estimates. Press R and correct them per photo. -->

      <!-- The 16:9 plates. The cycle loops over however many of these exist, so adding a
           fourth is markup only. Every screen measured off the plate and HEIGHT-fitted —
           all three are wider than 16:9 (2.05, 2.10, 2.38), so matching widths would push
           our aperture past the top and bottom of the board. -->
      <figure class="body" data-body="frame-01" style="--sw:53.29; --sh:39.15; --sx:49.87; --sy:58.95;">
        <img src="assets/hero-01.jpg" alt="">
      </figure>

      <figure class="body" data-body="frame-02" style="--sw:52.86; --sh:33.57; --sx:49.89; --sy:47.70;">
        <img src="assets/hero-02.jpg" alt="">
      </figure>

      <figure class="body" data-body="frame-03" style="--sw:65.45; --sh:44.66; --sx:49.89; --sy:51.17;">
        <img src="assets/hero-03.jpg" alt="">
      </figure>

      <figure class="body" data-body="frame-04" style="--sw:64.48; --sh:42.90; --sx:49.87; --sy:48.69;">
        <img src="assets/hero-04.jpg" alt="">
      </figure>

      <!-- the one that is not on the ground. Registration measured off the cut-out, not guessed:
           screen is 94.4% of the photo's width, dead centre both axes. -->
      <figure class="body" data-body="phone" style="--sw:94.4; --sx:50.1; --sy:50.0;">
        <img src="assets/body-phone.png" alt="">
      </figure>
    </div>

    <!-- 3 · CROP — permanent chrome, present on 16:9 and 9:16 alike -->
    <div class="crop" id="crop" aria-hidden="true">
      <span class="crop__c crop__c--tl"></span><span class="crop__c crop__c--tr"></span>
      <span class="crop__c crop__c--bl"></span><span class="crop__c crop__c--br"></span>
    </div>

    <!-- 4 · APERTURE ──────────────────────────────────────────────────────────────────── -->
    <div class="aperture" id="aperture">
      <!-- the page grid, continuing inside the frame — same six column positions -->
      <div class="ap-grid" aria-hidden="true">
        <span style="left:9%"></span><span style="left:25.5%"></span><span style="left:41.8%"></span>
        <span style="left:58.2%"></span><span style="left:74.5%"></span><span style="left:91%"></span>
      </div>
    </div>

    <!-- The headline is NOT inside the aperture. The aperture now resizes to whatever the
         current plate's screen is — the headline has to stay put while that happens. -->
    <div class="headline" id="headline">
      <p class="aperture__m" id="apRatio">—</p>
      <h1 class="aperture__h">the content<br>lives here</h1>
    </div>

    <!-- the phone's screen chrome, sitting on the white screen OUTSIDE the crop box.
         The clock reads 9:16, because of course it does. -->
    <div class="screenui" id="screenui" aria-hidden="true">
      <div class="status">
        <span class="status__time">9:16</span>
        <span class="status__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5.5" width="3" height="5.5" rx="1"/><rect x="9.2" y="3" width="3" height="8" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1 4.1a10 10 0 0 1 14 0"/><path d="M3.7 6.8a6.2 6.2 0 0 1 8.6 0"/><circle cx="8" cy="10" r="1.1" fill="currentColor" stroke="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".7" y=".7" width="21.6" height="10.6" rx="3" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.6" fill="currentColor"/><path d="M24 4.2v3.6a2.2 2.2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity=".45"/></svg>
        </span>
      </div>
      <div class="homebar"></div>
    </div>

    <!-- v1's mobile overlay: orange, wipes in from the right, one link per 9:16 row -->
    <div class="menu" id="menu" aria-hidden="true">
      <div class="menu__panel">
        <div class="menu__grid" aria-hidden="true">
          <span style="left:9%"></span><span style="left:25.5%"></span><span style="left:41.8%"></span>
          <span style="left:58.2%"></span><span style="left:74.5%"></span><span style="left:91%"></span>
        </div>
        <nav class="menu__links" aria-label="Mobile primary">
          <a class="menu__row" href="#">what we do</a>
          <a class="menu__row" href="#">our work</a>
          <a class="menu__row" href="#">work with us</a>
        </nav>
      </div>
    </div>

    <p class="cue" id="cue">scroll ↓ &nbsp;·&nbsp; press R for registration mode</p>
  </div>
</section>

<pre id="regout"></pre>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const reduce  = matchMedia("(prefers-reduced-motion: reduce)").matches;
const bodies  = [...document.querySelectorAll(".body")];
const props   = [...document.querySelectorAll(".prop")];
const apEl    = document.getElementById("aperture");
const ratioEl = document.getElementById("apRatio");
const root    = document.documentElement;

/* aperture geometry. Starts a large fixed 16:9 — the viewport is NOT restricted. Ends on a
   9:16 frame inset inside the phone's screen.

   All four constants below are MEASURED off assets/body-phone.png, not guessed. If the
   mockup is ever replaced, re-run the measurement and update them here. */
const PHONE_TOP   = 16;            /* px from viewport top — same as the nav's top margin */
const PHOTO_AR    = 2885 / 1400;   /* the cut-out's height / width */
const SCREEN_W    = 0.944;         /* screen width, as a fraction of the photo width */
const SCREEN_TOP  = 0.010;         /* screen top, as a fraction of photo height */
const SCREEN_HGT  = 0.979;         /* screen height, as a fraction of photo height */
const ISLAND_END  = 0.046;         /* dynamic island's bottom, as a fraction of screen height */

/* The screen is divided into three bands. The crop box is NOT the screen — the status bar
   and the home bar sit on white screen outside it, which is what lets the crop LINE read as
   a crop line instead of the edge of the display.
     [ status band — island, clock, wifi/battery ]
     [ nav band    — the bar, once it has constricted ]
     [ CROP BOX    — the site                        ]
     [ home band   — home indicator, clears the corner curvature ]
   The frame no longer has to be exactly 9:16 — it only has to read vertical — so it grows
   up toward the island and down to where the corner radius starts. It lands near 1:1.82. */
/* These were far too thin. At 0.052 the status band ended only ~5px below the island, so the
   nav sat on top of it and buried the clock; at 0.042 the home band was thinner than the
   screen's own corner radius, so the crop's bottom line and its registration marks ran out
   past the curvature. Both bands now clear their obstacle with real margin. */
const STATUS_F = 0.095;   /* status band height, as a fraction of screen height */
const NAV_PAD  = 0.075;   /* the nav's own side inset — wider than the frame's, so the bar is
                             visibly narrower than the crop box rather than matching it */
const NAVBAND_F= 0.058;   /* nav band height — raised so a logo matching the 44px burger fits */
const CROP_GAP = 10;      /* px between the dynamic island's edge and the crop's top line */
const NAV_INSET= 8;       /* px between the crop's top line and the nav inside it */
const HOME_RISE= 3;       /* px the home indicator sits above its centred position */
const NAVGAP   = 8;       /* px of clear white between the nav and the crop line */
const HOME_F   = 0.075;   /* home band height,   as a fraction of screen height */
const SCREEN_PAD = 0.020; /* side inset for on-screen UI, as a fraction of screen width */
const ISLAND_MID = 0.0284;/* island's vertical centre, as a fraction of screen height */
const CORNER_R   = 0.090; /* screen's corner radius, as a fraction of screen WIDTH */

function geo(){
  const vw = innerWidth, vh = innerHeight;
  /* The whole phone has to be visible — the island is what the nav hangs off, so it can never
     bleed off the top. Work backwards from the mockup: the photo fits the viewport height
     with PHONE_TOP either side, and the screen is a known fraction of the photo. */
  const photoH = vh - PHONE_TOP * 2;
  const photoW = photoH / PHOTO_AR;
  const screenW   = photoW * SCREEN_W;
  const screenTop = PHONE_TOP + photoH * SCREEN_TOP;
  const screenH   = photoH * SCREEN_HGT;

  const statusH = screenH * STATUS_F;
  const navH    = screenH * NAVBAND_F;
  const homeH   = screenH * HOME_F;
  /* the crop's TOP line now sits between the island and the nav — just under the island edge,
     well clear of the screen's top radius — so the nav is framed content inside the crop box
     rather than chrome floating above it. */
  const frameTop = screenTop + screenH * ISLAND_END + CROP_GAP;
  const endH     = (screenTop + screenH - homeH) - frameTop;
  /* the frame insets from the screen edges too — flush, its 12px corner registration marks
     get clipped by the bezel and the whole thing reads as a layer pasted over the photo. */
  const endW     = screenW - screenW * SCREEN_PAD * 2;

  /* start: as big a 16:9 as fits with room for a body around it */
  const startW = Math.min(vw * 0.62, vh * 0.60 * 16 / 9);
  return { startW, startH: startW * 9 / 16, endW, endH, photoW, photoH, screenW,
           screenTop, screenH, statusH, navH, homeH, frameTop,
           vw, vh, ready: vw > 0 && vh > 0 };
}
let G = geo();
/* the phone's screen width IS the site column — publish it so everything downstream agrees
   instead of the hero and the page each deriving their own number. */
function publishCol(){ root.style.setProperty("--col", G.endW + "px"); }
publishCol();

const navEl = document.getElementById("nav");

/* How far the frame sits BELOW dead centre once it has landed in the phone.
   Centred, the dynamic island eats most of the top band and the nav has nowhere to go. On a
   real phone content runs from under the nav down to the bottom of the screen — so anchor the
   frame's bottom to the screen's bottom, and the whole spare band collects above it. */
function apOffset(){
  return G.frameTop - (G.vh - G.endH) / 2;
}

function setAperture(w, h, p = 0){
  root.style.setProperty("--apw", w + "px");
  root.style.setProperty("--aph", h + "px");
  root.style.setProperty("--apy", (apOffset() * p) + "px");
  /* the phone scales off the SCREEN, not the crop box — see .body[data-body="phone"] */
  root.style.setProperty("--screenw", gsap.utils.interpolate(G.startW, G.screenW, p) + "px");
  const r = w / h;
  ratioEl.textContent = r >= 1 ? `${r.toFixed(2)} : 1` : `1 : ${(1/r).toFixed(2)}`;
}

/* THE NAV MORPH — v1's bar shrinks onto the phone and parks below the dynamic island.
   p = 0 → fixed 16px from the top, capped at 1180px (v1 geometry, styles.css:116).
   p = 1 → exactly the screen's width, sitting just under the island, hamburger only. */
const uiEl = document.getElementById("screenui");

function setNav(p){
  const pad    = 20;
  const startW = Math.min(1180, G.vw - pad * 2);
  /* the nav parks in its own band: below the status bar, above the crop line, touching neither.
     It also insets from the screen's left and right edges — flush to the bezel reads as a
     layer pasted over the photo; inset reads as UI running ON the screen. */
  const endTop = G.frameTop + NAV_INSET;   /* the nav lives INSIDE the crop box now */
  const navEndW = G.screenW - G.screenW * NAV_PAD * 2;   /* narrower than the crop box */
  navEl.style.setProperty("--nav-w",   gsap.utils.interpolate(startW, navEndW, p) + "px");
  /* published so every section we add inside the frame shares one gutter with the nav */
  root.style.setProperty("--screen-pad", (G.screenW * SCREEN_PAD) + "px");
  navEl.style.setProperty("--nav-top", gsap.utils.interpolate(PHONE_TOP, endTop, p) + "px");
  navEl.style.setProperty("--nav-pad", gsap.utils.interpolate(pad, 0, p) + "px");
  /* on the phone the logo matches the burger's 44px box, so the two read as a pair */
  navEl.style.setProperty("--logo-h",  gsap.utils.interpolate(56, 44, p) + "px");
  navEl.classList.toggle("is-phone", p > 0.55);
  navEl.classList.toggle("is-glass", p <= 0.55);   /* glass over the photo, solid on the phone */
  if (p <= 0.55) closeMenu();     /* a wide bar must never keep a phone overlay open */

  /* the phone's own chrome fades up with the mockup */
  uiEl.style.setProperty("--scr-top", G.screenTop + "px");
  uiEl.style.setProperty("--scr-w",   G.screenW + "px");
  uiEl.style.setProperty("--scr-h",   G.screenH + "px");
  /* the status ROW is not the status BAND. Position it explicitly so its centre lands on the
     island's centreline — deriving it from the band height and align-items left it floating
     high above the island. */
  const rowH = G.screenH * 0.026;
  uiEl.style.setProperty("--status-h",   rowH + "px");
  uiEl.style.setProperty("--status-top", (G.screenH * ISLAND_MID - rowH / 2) + "px");
  uiEl.style.setProperty("--home-b",  (G.homeH / 2 - 2.5 + HOME_RISE) + "px");
  uiEl.style.opacity = p > 0.6 ? String((p - 0.6) / 0.4) : "0";
}
setAperture(G.startW, G.startH);

/* ── the timeline ───────────────────────────────────────────────────────────────────────
   FIRST HALF  (0 → .52): aperture is FIXED. Only the body swaps. This is the correction —
                          nothing contracts, nothing restricts, the 16:9 world just IS.
   SECOND HALF (.52 → 1):  aperture contracts to 9:16, phone takes over, ground reveals. */
const tl = gsap.timeline({
  defaults:{ ease:"none" },
  scrollTrigger:{
    trigger:"#hero", start:"top top", end:"bottom bottom", scrub:.6,
    onUpdate: self => handoff(self.progress)   /* cycle ⇄ phone, both directions */
  }
});

/* --- bodies cycle on their own clock, NOT on scroll ---------------------------------
   The landscape formats cross-fade continuously whether or not you move: tv → cinema →
   billboard → laptop → back. The aperture stays put; only the thing holding it changes.
   Scroll owns exactly one thing — the transformation. */
/* derived from the markup, not hard-coded to four — drop another plate in and it joins the loop */
const LANDSCAPE = bodies.filter(b => b.dataset.body !== "phone");
const PHONE     = bodies.find(b => b.dataset.body === "phone");
const HOLD_MS   = 1100;      /* how long each format holds */
const FADE_S    = 0.32;      /* cross-fade */
let cyc = 0, timer = null, onPhone = false;

/* NO DIP CROSS-FADE.
   Fading the outgoing plate out while fading the incoming one in makes their combined alpha
   drop below 1 halfway through, so the background flashes between photos. Instead the
   outgoing plate is held fully opaque underneath and only the incoming one fades up on top;
   the others are hidden after it has fully covered them. Every plate is larger than the
   viewport (checked in the self-check), so the one on top always covers what it replaces. */
/* ── each plate's own screen, in viewport pixels ──────────────────────────────────────
   The plates are NOT all 16:9 (2.38 / 2.10 / 1.95 / 2.00) — they are the landscape formats
   the marketing world actually runs on, which is the point. So the aperture stops being a
   fixed 16:9 box and becomes whatever the current plate's screen is, edge to edge, and the
   grid fills it with no gutters. Each plate is scaled to cover the viewport; its screen
   centre sits dead centre, so the rect is just centred on the middle of the screen. */
function plateGeom(b){
  const img = b.querySelector("img");
  const ar  = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 16 / 9;
  const n   = k => +b.style.getPropertyValue("--" + k);
  const w   = Math.max(G.vw, G.vh * ar);      /* cover */
  const h   = w / ar;
  return { plateW:w, w: w * n("sw") / 100, h: h * n("sh") / 100 };
}
function sizePlates(){
  LANDSCAPE.forEach(b => b.style.setProperty("--plate-w", plateGeom(b).plateW + "px"));
}

let curPlate = null;                 /* the screen rect currently on show — the morph's start */
const apProxy = { w:0, h:0 };
function tweenAperture(w, h, dur){
  gsap.to(apProxy, { w, h, duration:dur, ease:"power1.inOut", overwrite:"auto",
    onUpdate(){ setAperture(apProxy.w, apProxy.h, 0); } });
}

function showLandscape(i){
  const incoming = LANDSCAPE[i];
  LANDSCAPE.forEach((b, j) => { b.style.zIndex = j === i ? 2 : 1; });
  gsap.killTweensOf(LANDSCAPE);
  gsap.to(incoming, {
    opacity:1, duration:FADE_S, ease:"power1.inOut",
    onComplete(){ LANDSCAPE.forEach((b, j) => { if (j !== i) gsap.set(b, { opacity:0 }); }); }
  });
  /* the grid follows the plate's screen on the same curve as the cross-fade */
  const g = plateGeom(incoming);
  curPlate = g;
  if (lastP < MORPH_AT) tweenAperture(g.w, g.h, FADE_S);
}
function startCycle(){
  if (timer || reduce) return;
  showLandscape(cyc);
  timer = setInterval(() => { cyc = (cyc + 1) % LANDSCAPE.length; showLandscape(cyc); }, HOLD_MS);
}
function stopCycle(){ clearInterval(timer); timer = null; }

/* handoff — once the morph starts, the cycle stops and the phone takes over. Scroll back up
   above the threshold and the cycle resumes where it left off. */
const MORPH_AT = 0.06;
function handoff(progress){
  const wantPhone = progress >= MORPH_AT;
  if (wantPhone === onPhone) return;
  onPhone = wantPhone;
  if (wantPhone){
    stopCycle();
    LANDSCAPE.forEach(b => gsap.to(b, { opacity:0, duration:FADE_S, overwrite:"auto" }));
    gsap.to(PHONE, { opacity:1, duration:FADE_S, overwrite:"auto" });
  } else {
    gsap.to(PHONE, { opacity:0, duration:FADE_S, overwrite:"auto" });
    startCycle();
  }
}
sizePlates();
startCycle();
if (reduce) showLandscape(0);

/* --- the contraction: 16:9 → 9:16 ---
   NOTE: this was `fromTo({p:0},{p:1},{p:1,…})`, which GSAP reads as from p=1 to p=1 — the
   proxy never moved, so onUpdate read a constant and nothing reversed on scroll-up. A
   single proxy object tweened with .to() animates and scrubs backwards correctly. */
/* last eased progress, so a resize or a late load can re-place everything from the CURRENT
   geometry. Without this, G is recomputed on load/resize but the screen chrome keeps the
   --scr-top it was given at parse time — which is how the status bar ended up off the phone. */
let lastP = 0;

const morph = { p: 0 };
tl.to(morph, {
  p:1, duration:.65,
  onUpdate(){
    const p = lastP = gsap.parseEase("power2.inOut")(morph.p);
    /* the morph starts from whichever plate's screen is on show, not a notional 16:9 box */
    const from = curPlate || { w:G.startW, h:G.startH };
    gsap.killTweensOf(apProxy);
    setAperture(gsap.utils.interpolate(from.w, G.endW, p),
                gsap.utils.interpolate(from.h, G.endH, p), p);
    setNav(p);   /* the bar shrinks onto the phone on the same curve */
  }
}, 0.05);

/* --- the ground the phone is standing over reveals in the gutters ---
   The phone itself is owned by handoff(), not the timeline — one owner per element, or the
   two fight over opacity. The pavement is not there at the start; the light Swiss grid is.
   It washes in over the grid as the frame turns vertical, so the world only becomes "street"
   once you're on the phone. Scrubs backwards cleanly, so scrolling up returns you to the grid. */
tl.to("#ground", { opacity:1, duration:.28, ease:"power1.inOut" }, 0.18)
  .to("#cue", { opacity:0, duration:.05 }, 0.02);

/* props settle onto the pavement once the ground is lit */
props.forEach((p, i) => {
  const rot = p.style.getPropertyValue("--rot") || "0deg";
  tl.fromTo(p, { opacity:0, scale:.9, rotate:rot },
               { opacity:1, scale:1, rotate:rot, duration:.12 }, 0.42 + i * 0.02);
});

/* ── the phone's hamburger ──────────────────────────────────────────────────────────────
   Same behaviour a phone nav has: toggles a full-screen overlay, but clipped to the screen
   so it stays inside the mockup. Esc closes it, and so does scrolling back out of phone mode. */
const menuEl   = document.getElementById("menu");
const burgerEl = document.getElementById("burger");
/* queries the DOM rather than closing over menuEl/burgerEl: setNav() calls this, and
   ScrollTrigger can fire setNav before those consts initialise — that would be a TDZ throw. */
function closeMenu(){
  if (!navEl.classList.contains("is-open")) return;
  const m = document.getElementById("menu"), b = document.getElementById("burger");
  navEl.classList.remove("is-open"); m.classList.remove("is-open");
  b.classList.remove("is-open");          /* v1 puts is-open on the BUTTON — that's the X selector */
  b.setAttribute("aria-expanded", "false"); m.setAttribute("aria-hidden", "true");
}
burgerEl.addEventListener("click", () => {
  const open = !navEl.classList.contains("is-open");
  navEl.classList.toggle("is-open", open);
  menuEl.classList.toggle("is-open", open);
  burgerEl.classList.toggle("is-open", open);
  burgerEl.setAttribute("aria-expanded", String(open));
  menuEl.setAttribute("aria-hidden", String(!open));
});
addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

setNav(0);   /* park the bar at v1 geometry before any scrolling happens */

/* ── registration mode ─────────────────────────────────────────────────────────────────
   Press R. Outlines the aperture over the current body so you can align a swapped photo.
   Arrow keys nudge --sx/--sy, [ and ] resize --sw. Numbers print live — copy them into
   the style attribute and the photo is registered for good. */
const out = document.getElementById("regout");
let regOn = false, sel = 0;

function live(){ /* whichever body is most visible right now */
  return bodies.reduce((a, b) =>
    (+getComputedStyle(b).opacity > +getComputedStyle(a).opacity ? b : a));
}
function paint(){
  bodies.forEach(b => b.classList.remove("is-live"));
  const b = bodies[sel]; b.classList.add("is-live");
  const g = n => +b.style.getPropertyValue("--" + n);
  out.textContent =
    `REGISTRATION — ${bodies.map((x,i)=>(i===sel?"[":" ")+x.dataset.body+(i===sel?"]":" ")).join(" ")}\n` +
    `TAB switch · ARROWS move screen centre · [ ] resize screen · R exit\n\n` +
    `  style="--sw:${g("sw")}; --sx:${g("sx")}; --sy:${g("sy")};"\n\n` +
    `paste that onto <figure class="body" data-body="${b.dataset.body}">`;
}
addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R"){
    regOn = !regOn; document.body.classList.toggle("reg", regOn);
    if (regOn){ sel = bodies.indexOf(live()); paint(); }
    return;
  }
  if (!regOn) return;
  const b = bodies[sel], set = (n, d) =>
    b.style.setProperty("--" + n, (+b.style.getPropertyValue("--" + n) + d).toFixed(1));
  const k = e.key;
  if (k === "Tab"){ e.preventDefault(); sel = (sel + 1) % bodies.length; }
  else if (k === "ArrowLeft")  set("sx", -0.5);
  else if (k === "ArrowRight") set("sx",  0.5);
  else if (k === "ArrowUp")    set("sy", -0.5);
  else if (k === "ArrowDown")  set("sy",  0.5);
  else if (k === "[")          set("sw", -1);
  else if (k === "]")          set("sw",  1);
  else return;
  e.preventDefault(); paint();
});

/* re-place everything from the CURRENT geometry at the CURRENT progress */
function reflow(){
  G = geo(); publishCol();
  sizePlates();
  if (curPlate) curPlate = plateGeom(LANDSCAPE[cyc]);   /* re-measure at the new viewport */
  const from = curPlate || { w:G.startW, h:G.startH };
  setAperture(gsap.utils.interpolate(from.w, G.endW, lastP),
              gsap.utils.interpolate(from.h, G.endH, lastP), lastP);
  setNav(lastP);
  ScrollTrigger.refresh();
}
addEventListener("resize", reflow, {passive:true});

/* ── SELF-CHECK ────────────────────────────────────────────────────────────────────────
   Verifies the mechanic AND reports exactly which photographs are still missing, so the
   rig tells you what it needs instead of you hunting for it. */
function check(){
  const g = geo();
  if (!g.ready) return;

  const endR = g.endH / g.endW;
  /* the aperture no longer starts at a fixed 16:9 — it IS the current plate's screen. The
     thing that now matters is that it matches that screen exactly, so the grid has no gutters. */
  const apW = parseFloat(root.style.getPropertyValue('--apw')) || 0;
  const apH = parseFloat(root.style.getPropertyValue('--aph')) || 0;
  const plateRects = LANDSCAPE.map(b => ({ id:b.dataset.body, ...plateGeom(b) }));
  const shown = curPlate || plateRects[0];
  const fillsScreen = !!curPlate && Math.abs(apW - shown.w) < 2 && Math.abs(apH - shown.h) < 2;
  /* the frame no longer has to be exactly 9:16 — it has to READ vertical. 9:16 is 1.78. */
  const isVertical = endR > 1.55 && endR < 2.05;
  const fits   = g.startW < g.vw && g.startH < g.vh;   /* body needs room around it */
  /* the whole phone must be visible — the nav hangs off the dynamic island, so the top of
     the mockup can never bleed off screen. */
  const phoneFits = g.photoH + PHONE_TOP * 2 <= g.vh + 1;
  const navTop    = g.frameTop + NAV_INSET;
  const navBot    = navTop + g.navH;
  const islandBot = g.screenTop + g.screenH * ISLAND_END;
  /* the crop's top line sits between the island and the nav, and the nav is INSIDE the box */
  const clearsIsland = g.frameTop >= islandBot - 1;
  const navInside    = navTop >= g.frameTop - 1 && navBot <= g.frameTop + g.endH + 1;
  const homeRoom     = (g.screenTop + g.screenH) - (g.frameTop + g.endH) >= g.homeH - 1;
  /* the crop's bottom line and its 12px marks must stop ABOVE where the screen's corner
     radius begins, or they run out over the curvature and off the phone. */
  const cornerR      = g.screenW * CORNER_R;
  const bottomGap    = (g.screenTop + g.screenH) - (g.frameTop + g.endH);
  const clearsCurve  = bottomGap >= cornerR + 12;

  const missingBody = bodies.filter(b => !b.querySelector("img"));
  const missingProp = props.filter(p => !p.querySelector("img"));
  const noGround    = !document.querySelector("#ground img");
  const badReg      = bodies.filter(b => {
    const n = k => +b.style.getPropertyValue("--" + k);
    return !(n("sw") > 0 && n("sw") <= 100 && n("sx") >= 0 && n("sx") <= 100 && n("sy") >= 0 && n("sy") <= 100);
  });

  console.assert(fillsScreen, "FAIL: aperture does not fill the plate screen — grid will gutter");
  console.assert(isVertical, "FAIL: landed frame does not read vertical — 1:", endR.toFixed(3));
  console.assert(fits,   "FAIL: aperture fills the viewport — no room for a body around it");
  console.assert(phoneFits, "FAIL: phone mockup does not fit the viewport — island would clip");
  console.assert(clearsIsland, "FAIL: crop top line overlaps the dynamic island");
  console.assert(navInside, "FAIL: nav is not inside the crop box");
  console.assert(homeRoom, "FAIL: frame runs into the home band");
  console.assert(clearsCurve, "FAIL: crop's bottom line runs past the corner curvature —",
                 `${Math.round(bottomGap)}px gap, needs ${Math.round(cornerR + 12)}px`);
  console.assert(!badReg.length, "FAIL: bad registration data on", badReg.map(b=>b.dataset.body));

  /* every plate must be larger than the viewport, or the no-dip cross-fade would let the
     background show at the edges when the outgoing plate is hidden. */
  const platesCover = bodies.filter(b=>b.dataset.body!=="phone").every(b=>{
    const r=b.getBoundingClientRect(); return r.width>=g.vw-1 && r.height>=g.vh-1;
  });
  console.assert(platesCover, "FAIL: a 16:9 plate is smaller than the viewport — cross-fade will flash");

  const pass = fillsScreen && isVertical && fits && phoneFits && clearsIsland && navInside && homeRoom && clearsCurve && !badReg.length;
  console.log(
`9x16 hero rig — self-check
  mechanic : plate screen ${Math.round(shown.w)}×${Math.round(shown.h)} (${(shown.w/shown.h).toFixed(2)}:1)  →  ${Math.round(g.endW)}×${Math.round(g.endH)} (1:${endR.toFixed(2)} — vertical)
  plates   : ${plateRects.map(r=>r.id.replace('frame-','')+' '+(r.w/r.h).toFixed(2)+':1').join(' · ')}   none is 16:9, by design
  grid fill: aperture ${Math.round(apW)}×${Math.round(apH)} vs screen ${Math.round(shown.w)}×${Math.round(shown.h)} — ${fillsScreen?'exact, no gutters':'MISMATCH'}
  phone    : ${Math.round(g.photoW)}×${Math.round(g.photoH)} mockup, top at ${PHONE_TOP}px — fully visible
  screen   : ${Math.round(g.screenW)}×${Math.round(g.screenH)} — bands: status ${Math.round(g.statusH)} · nav ${Math.round(g.navH)} · CROP ${Math.round(g.endH)} · home ${Math.round(g.homeH)}
  island   : ends y=${Math.round(islandBot)} · CROP LINE y=${Math.round(g.frameTop)} (clears island by ${Math.round(g.frameTop - islandBot)}px) · nav ${Math.round(navTop)}–${Math.round(navBot)}, inside the box
  plates   : ${platesCover ? "all cover the viewport — cross-fade cannot flash" : "TOO SMALL — will flash"}
  bottom   : crop line y=${Math.round(g.frameTop + g.endH)} · screen ends ${Math.round(g.screenTop + g.screenH)} · gap ${Math.round(bottomGap)}px vs ${Math.round(cornerR + 12)}px needed to clear the curvature
  gutters  : ${Math.round((g.vw - g.photoW) / 2)}px each side — pavement, never content
  --col    : ${Math.round(g.endW)}px (screen width = site column)
  timing   : morph 0.05→0.70 of an 80vh pin — starts on the first scroll
  ${pass ? "✓ RIG PASS" : "✗ RIG FAIL"}

photos still needed (${missingBody.length + missingProp.length + (noGround?1:0)}):
  ${noGround ? "· ground-pavement.jpg  — top-down, 9:16 pavers, filling frame" : "✓ ground in"}
${missingBody.map(b => `  · body-${b.dataset.body}.png    — screen blank, cut-out`).join("\n")}
${missingProp.map(p => `  · prop-${p.dataset.prop}.png    — cut-out, client branding`).join("\n")}

registration : press R over any body to align a swapped photo.`);
}
addEventListener("load", () => { reflow(); check(); });
check();
</script>
