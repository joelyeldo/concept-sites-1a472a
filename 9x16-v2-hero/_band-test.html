<!doctype html><meta charset="utf-8">
<title>band centring test</title>
<style>
  @font-face{font-family:"Switzer";src:url("assets/Switzer-Variable.woff2") format("woff2");font-weight:100 900;font-display:block;}
  body{margin:0;background:#FAFAFA;font-family:system-ui;}
  .row{padding:5px 12px;}
  h3{font:600 11px/1 system-ui;margin:0 0 3px;color:#666;letter-spacing:.08em;text-transform:uppercase;}
  svg{display:block;background:#fff;}
  .rib{fill:none;stroke:#100C08;stroke-width:20;stroke-linecap:round;}
  .mid{fill:none;stroke:#FF3B30;stroke-width:.5;stroke-dasharray:3 3;}
  .t{fill:#FAFAFA;font-family:"Switzer",sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em;}
  .sq{fill:#FF7B00;}
</style>
<script>
  const SHIFTS=[0,-0.8,-1.2,-1.6,-2.0];
  const D="M -20,60 C 120,-10 300,40 420,90";
  document.write(SHIFTS.map(function(s,i){return '<div class="row"><h3>baseline-shift '+(s===0?'0  (as shipped)':s)+'</h3>'
   +'<svg viewBox="0 0 400 130" width="1180" height="383">'
   +'<defs><path id="p'+i+'" d="'+D+'"/></defs>'
   +'<use href="#p'+i+'" class="rib"/>'
   +'<text class="t" dominant-baseline="central"><textPath href="#p'+i+'" startOffset="2%" '+(s?'baseline-shift="'+s+'"':'')+'>shot tall <tspan class="sq">&#9642;</tspan> cut tight <tspan class="sq">&#9642;</tspan> watched twice <tspan class="sq">&#9642;</tspan> skipped never</textPath></text>'
   +'<use href="#p'+i+'" class="mid"/></svg></div>';}).join(""));
</script>
